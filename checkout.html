<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#681d2b" />
    <title>Checkout | Sharmaji Foods</title>
    <meta
      name="description"

    <meta name="robots" content="noindex" />

    <link rel="stylesheet" href="public/style.css" />

  <body data-page="/checkout">
    <div id="app">
      <a class="skip" href="#main">Skip to content</a>
      <header class="mast">
        <div class="head-inner">
          <a href="index.html" class="brand" aria-label="Sharmaji Foods"
            ><svg
              aria-hidden="true"
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="5.8" y="7.5" width="12.4" height="9" rx="2" />
              <path
                d="M5.8 10.5H2a1.5 1.5 0 0 0 0 3h3.8m12.4-3H22a1.5 1.5 0 0 1 0 3h-3.8M9 10h5"

            ><span>Sharmaji Foods</span></a
          >
          <nav aria-label="Menu" class="desktop-nav">
            <a href="index.html">Home</a><a href="about.html">About Us</a
            ><a href="menu.html">Food Menu</a><a href="bulk-orders.html">Bulk Orders</a
            ><a href="contact.html">Contact</a>
          </nav>
          <div class="tools">
            <label class="lang"
              ><svg
                aria-hidden="true"
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <ellipse cx="12" cy="12" rx="4" ry="9" />
                <path d="M3 12h18" /></svg
              ><select id="language" aria-label="Language">
                <option value="en" selected>EN</option>
                <option value="ta">தமிழ்</option>
                <option value="hi">हिन्दी</option>
              </select></label
            ><a class="bag" href="cart.html" aria-label="Cart"
              ><svg
                aria-hidden="true"
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 7.5h14l1 13H4l1-13Z" />
                <path d="M8 9V6a4 4 0 0 1 8 0v3" /></svg></a
            ><button
              id="hamburger"
              aria-label="Menu"
              aria-expanded="false"
              aria-controls="mobile-nav"
            >
              <svg
                aria-hidden="true"
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 6h18M3 12h18M3 18h18" />
              </svg>
            </button>
          </div>
        </div>
        <nav id="mobile-nav" hidden>
          <a href="index.html">Home</a><a href="about.html">About Us</a
          ><a href="menu.html">Food Menu</a><a href="bulk-orders.html">Bulk Orders</a

      <main id="main">
        <div class="wrap page narrow">
          <div class="panel centered">
            <svg
              aria-hidden="true"
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"

                <path
                  d="M5.8 10.5H2a1.5 1.5 0 0 0 0 3h3.8m12.4-3H22a1.5 1.5 0 0 1 0 3h-3.8M9 10h5"

          <nav>
            <a href="index.html">Home</a><a href="about.html">About Us</a
